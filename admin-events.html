<!DOCTYPE html>
<html lang="ar" dir="rtl" data-protected="true">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>سجل أحداث المنصة — Quadra Level</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="/css/shared.css">
<style>
.wrap{max-width:1400px;margin:auto;padding:40px 24px 80px}.head{display:flex;justify-content:space-between;align-items:start;gap:20px;flex-wrap:wrap}.head h1{margin:0 0 8px;font-size:2rem}.muted{color:var(--text-faint);line-height:1.7}.toolbar,.summary,.event{background:var(--surface);border:1px solid var(--border);border-radius:16px}.toolbar{padding:18px;margin:24px 0;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}.field label{display:block;color:var(--text-dim);font-size:.75rem;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;background:var(--surface-strong);border:1px solid var(--border);border-radius:10px;color:var(--text)}.summary{display:flex;gap:10px;overflow:auto;padding:14px;margin-bottom:20px}.sum{min-width:130px;padding:12px;border-radius:12px;background:var(--surface-strong)}.sum strong{display:block;color:var(--gold-soft);font-size:1.25rem}.sum span{font-size:.72rem;color:var(--text-faint)}.events{display:flex;flex-direction:column;gap:10px}.event{padding:15px;display:grid;grid-template-columns:150px 1fr 180px;gap:16px;align-items:start}.event-type{color:var(--gold-soft);font-weight:800}.event-main strong{display:block;margin-bottom:5px}.event-main small,.event-meta{color:var(--text-faint);font-size:.75rem;line-height:1.8}.status-success{color:var(--success)}.status-error{color:var(--danger)}.pagination{display:flex;justify-content:center;gap:10px;margin-top:20px;align-items:center}@media(max-width:900px){.toolbar{grid-template-columns:repeat(2,1fr)}.event{grid-template-columns:1fr}.event-meta{border-top:1px solid var(--border);padding-top:8px}}
</style></head>
<body><div class="geo-bg"><div class="geo-shape geo-circle" style="width:230px;height:230px;top:8%;left:4%"></div></div><nav class="topbar"><div class="brand"><img src="/images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">Quadra Level</span></div><a class="btn btn-ghost btn-sm" href="/admin"><i class="fas fa-arrow-right"></i> لوحة الإدارة</a><div class="spacer"></div><div id="userChipHolder"></div></nav>
<main class="wrap"><header class="head"><div><h1><i class="fas fa-chart-line"></i> سجل أحداث المنصة</h1><p class="muted">كل طلبات الـAPI، الزيارات، التسجيلات، الدخول، التجارب، المدفوعات، التقدم، الاختبارات، المشاريع، الشهادات وأحداث الإدارة في مكان واحد.</p></div><button id="refresh" class="btn btn-primary"><i class="fas fa-rotate"></i> تحديث</button></header><section id="summary" class="summary"><div class="muted">جاري تحميل الملخص...</div></section><form id="filters" class="toolbar"><div class="field"><label>نوع الحدث</label><select id="eventType"><option value="">كل الأنواع</option><option>page_view</option><option>registration</option><option>login</option><option>payment</option><option>campaign</option><option>trial</option><option>assessment</option><option>graduation_project</option><option>mentor</option><option>affiliate</option><option>admin</option><option>api_request</option></select></div><div class="field"><label>الحالة</label><select id="status"><option value="">كل الحالات</option><option value="success">نجاح</option><option value="error">خطأ</option></select></div><div class="field"><label>رقم المستخدم</label><input id="userId" inputmode="numeric"></div><div class="field"><label>رقم الكورس</label><input id="courseId" inputmode="numeric"></div><div class="field"><label>بحث في المسار أو الحدث</label><input id="search"></div><button class="btn btn-outline" type="submit">تطبيق الفلتر</button></form><section id="events" class="events"><div class="muted">جاري تحميل الأحداث...</div></section><div class="pagination"><button id="prev" class="btn btn-ghost">السابق</button><span id="pageInfo" class="muted"></span><button id="next" class="btn btn-ghost">التالي</button></div></main>
<script src="/js/theme.js"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/platform-api.js"></script><script>
(function(){var page=1,params={limit:50};if(window.LMSUi)LMSUi.renderUserChip(document.getElementById('userChipHolder'));function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}function label(v){return ({page_view:'زيارة صفحة',registration:'تسجيل حساب',login:'دخول',payment:'دفع',campaign:'حملة',trial:'تجربة',assessment:'اختبار وتقييم',graduation_project:'مشروع تخرج',mentor:'Kero Mentor',affiliate:'مسوق',admin:'إدارة',content:'محتوى',api_request:'طلب API'})[v]||v;}function loadSummary(){LMSPlatformAPI.getAdminEventsSummary().then(function(x){var el=document.getElementById('summary');el.innerHTML=Object.keys(x.summary||{}).sort().map(function(k){return '<div class="sum"><strong>'+esc(x.summary[k].total)+'</strong><span>'+esc(label(k))+' خلال 30 يومًا</span></div>';}).join('')||'<div class="muted">لا توجد أحداث بعد.</div>';}).catch(function(e){document.getElementById('summary').innerHTML='<div class="muted">'+esc(e.message)+'</div>';});}function load(){var query=Object.assign({},params,{page:page});LMSPlatformAPI.getAdminEvents(query).then(function(x){var list=document.getElementById('events');list.innerHTML=(x.events||[]).map(function(e){return '<article class="event"><div class="event-type">'+esc(label(e.event_type))+'<br><small>'+esc(e.event_type)+'</small></div><div class="event-main"><strong>'+esc(e.action)+'</strong><small>'+esc(e.path||'')+'<br>المستخدم: '+esc(e.user_id||'زائر')+' — الكورس: '+esc(e.course_id||'—')+'</small></div><div class="event-meta"><span class="'+(e.status==='error'?'status-error':'status-success')+'">'+esc(e.status)+'</span><br>'+esc(new Date(e.created_at).toLocaleString('ar-EG'))+'<br>'+esc(e.method||'')+' · '+esc(e.duration_ms||0)+'ms</div></article>';}).join('')||'<div class="muted">لا توجد نتائج.</div>';document.getElementById('pageInfo').textContent='صفحة '+x.pagination.page+' من '+Math.max(1,x.pagination.pages)+' — '+x.pagination.total+' حدث';document.getElementById('prev').disabled=page<=1;document.getElementById('next').disabled=page>=x.pagination.pages;}).catch(function(e){document.getElementById('events').innerHTML='<div class="muted">'+esc(e.message)+'</div>';});}document.getElementById('filters').addEventListener('submit',function(e){e.preventDefault();params={limit:50,eventType:document.getElementById('eventType').value,status:document.getElementById('status').value,userId:document.getElementById('userId').value,courseId:document.getElementById('courseId').value,search:document.getElementById('search').value};Object.keys(params).forEach(function(k){if(!params[k])delete params[k];});page=1;load();});document.getElementById('refresh').addEventListener('click',function(){loadSummary();load();});document.getElementById('prev').addEventListener('click',function(){if(page>1){page--;load();}});document.getElementById('next').addEventListener('click',function(){page++;load();});loadSummary();load();})();
</script><script src="/js/activity.js"></script><script src="/js/sw-register.js"></script></body></html>
