<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من الشهادة — Quadra Level</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
.verify-wrap{max-width:720px;margin:0 auto;padding:70px 24px;position:relative;z-index:5}.verify-card{text-align:center;padding:32px;border-radius:24px}.verify-card h1{font-size:1.6rem;font-weight:900;margin:14px 0 8px}.verify-card p{color:var(--text-faint);line-height:1.8}.verify-form{display:flex;gap:10px;margin-top:22px}.verify-form input{flex:1;min-width:0;padding:13px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit}.verify-form input:focus{outline:0;border-color:var(--gold)}.verify-result{margin-top:20px;text-align:right;line-height:1.9}.valid{padding:18px;border-radius:16px;color:var(--success);background:rgba(0,200,150,.08);border:1px solid rgba(0,200,150,.3)}.invalid{padding:18px;border-radius:16px;color:var(--danger);background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.3)}.state-icon{font-size:2.5rem;color:var(--gold)}
@media(max-width:560px){.verify-form{flex-direction:column}.verify-form .btn{width:100%}}
</style>
</head>
<body>
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:220px;height:220px;top:7%;left:4%;"></div></div>
<nav class="topbar"><a class="btn btn-ghost btn-sm" href="courses.html"><i class="fas fa-arrow-right"></i> سوق الكورسات</a><div class="brand"><img src="images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">التحقق من الشهادة</span></div><div class="spacer"></div><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button></nav>
<main class="verify-wrap"><section class="verify-card surface-card"><i class="fas fa-shield-halved state-icon"></i><h1>التحقق من شهادة Quadra Level</h1><p>أدخل رمز التحقق الموجود أسفل الشهادة للتأكد من أنها صادرة من المنصة.</p><form class="verify-form" id="verifyForm"><input id="code" autocomplete="off" placeholder="أدخل رمز التحقق" required><button class="btn btn-primary" type="submit"><i class="fas fa-magnifying-glass"></i> تحقق</button></form><div id="result" class="verify-result"></div></section></main>
<script src="js/theme.js"></script><script src="js/config.js"></script><script src="js/platform-api.js"></script>
<script>
(function(){var input=document.getElementById('code'),result=document.getElementById('result'),preset=new URLSearchParams(location.search).get('code');if(preset)input.value=preset;function esc(v){return String(v==null?'':v).replace(/[&<>'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c];});}function check(code){result.innerHTML='<p>جاري التحقق...</p>';LMSPlatformAPI.verifyCertificate(code).then(function(data){var c=data.certificate||{};result.innerHTML='<div class="valid"><strong><i class="fas fa-circle-check"></i> شهادة صحيحة</strong><br>الطالب: '+esc(c.studentName)+'<br>الكورس: '+esc(c.course&&c.course.title)+'<br>رقم الشهادة: '+esc(c.certificateNumber)+'<br>تاريخ الإصدار: '+(c.issuedAt?new Date(c.issuedAt).toLocaleDateString('ar-EG'):'—')+'</div>';}).catch(function(err){result.innerHTML='<div class="invalid"><strong><i class="fas fa-circle-xmark"></i> تعذر التحقق</strong><br>'+esc(err.message||'الرمز غير صحيح.')+'</div>';});}document.getElementById('verifyForm').addEventListener('submit',function(e){e.preventDefault();var code=input.value.trim();if(code)check(code);});if(preset)check(preset);})();
</script><script src="js/sw-register.js"></script>
</body>
</html>
