<!DOCTYPE html>
<html lang="ar" dir="rtl" data-protected="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التعلم — Quadra Level</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.learn-shell{min-height:100vh;display:flex;flex-direction:column}.learnbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--bg);border-bottom:1px solid var(--border);box-shadow:0 8px 25px rgba(0,0,0,.2)}.learn-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.learn-status{font-size:.76rem;color:var(--text-faint);white-space:nowrap}.learn-frame-wrap{position:relative;z-index:5;flex:1;min-height:calc(100vh - 67px);background:#fff}.learn-frame{display:block;width:100%;height:calc(100vh - 67px);min-height:640px;border:0;background:#fff}.learn-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#445}.learn-state i{display:block;font-size:2rem;color:var(--gold);margin-bottom:12px}.learn-state a{margin-top:16px}
@media(max-width:640px){.learn-status{display:none}.learnbar{padding:10px 12px}.learn-frame{min-height:calc(100vh - 62px);height:calc(100vh - 62px)}}
@media print{.learn-frame-wrap,.learn-frame{visibility:hidden!important;display:none!important}body:after{content:'Quadralevel — printing disabled';display:block;text-align:center;padding:4rem}} .ql-shield{position:absolute;right:14px;bottom:12px;z-index:25;pointer-events:none;display:none;max-width:calc(100% - 28px)}.ql-shield.on{display:block}.ql-shield-grid{display:block}.ql-shield-grid span{display:block;font:500 10px/1.5 sans-serif;letter-spacing:.1px;color:rgba(65,83,110,.45);background:rgba(255,255,255,.75);border-radius:5px;padding:3px 6px;white-space:nowrap}@media(max-width:640px){.ql-shield{right:7px;bottom:7px}.ql-shield-grid span{font-size:9px}} </style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('lms_theme_v1')==='dark'?'dark':'light';}catch(e){document.documentElement.dataset.theme='light';}</script>
<link rel="stylesheet" href="/css/academy-v3-fonts.css">
<link rel="stylesheet" href="/css/academy-v3.css">
<script src="/js/academy-v3.js" defer></script>
</head>
<body data-brand="academy-v3" data-country-gate="true">
<div class="learn-shell"><nav class="learnbar"><a class="btn btn-ghost btn-sm" id="backLink" href="/courses"><i class="fas fa-arrow-right"></i> رجوع</a><div class="learn-title" id="learnTitle">جاري تحميل الكورس...</div><div class="learn-status" id="learnCountry"></div><div class="learn-status" id="learnStatus"></div><button type="button" class="btn btn-primary btn-sm" id="learnMentorButton" disabled aria-label="افتح Kero مساعدك التعليمي">Kero · اسأل</button><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button></nav><main class="learn-frame-wrap"><div class="learn-state" id="learnState"><div><i class="fas fa-spinner fa-spin"></i><div>جاري تجهيز محتوى الكورس...</div></div></div><div class="ql-shield" id="qlContentShield" aria-hidden="true"><div class="ql-shield-grid" id="qlShieldGrid"></div></div><iframe class="learn-frame" id="courseFrame" title="محتوى الكورس" style="display:none"></iframe></main></div>
<script src="/js/site-config.js"></script><script src="/js/meta-pixel.js"></script><script src="/js/theme.js"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/platform-api.js"></script>
<script src="/js/mentor.js?v=20261017-6"></script><script src="/js/course-learning-bridge.js?v=20261017-2"></script><script src="/js/country.js"></script><script src="/js/clean-routes.js"></script>
<script>
(function(){
  if(!window.LMSAuth || !LMSAuth.isLoggedIn()){ location.replace(LMSAuth.loginUrl(location.pathname+location.search)); return; }
  var route=QLRoutes.current(), id=route.course, courseSlug=String(route.course||''), requestedChapter=Number(route.chapter||0), frame=document.getElementById('courseFrame'), state=document.getElementById('learnState'), status=document.getElementById('learnStatus'), countryLabel=document.getElementById('learnCountry'), title=document.getElementById('learnTitle');
  var contentCourse=null, contentAccess=null, contentAssigned=false, contentRevealed=false;
  var shield=document.getElementById('qlContentShield'),shieldGrid=document.getElementById('qlShieldGrid');
  function activateShield(){var u=window.LMSAuth&&LMSAuth.currentUser&&LMSAuth.currentUser();var identifier=String(u&&(u.id||u.userId)||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,40);if(!identifier)return;shieldGrid.replaceChildren();for(var i=0;i<1;i++){var mark=document.createElement('span');mark.textContent='Quadralevel • ID '+identifier;shieldGrid.appendChild(mark);}shield.classList.add('on');}
  document.addEventListener('contextmenu',function(e){if(e.target.closest('.learn-frame-wrap'))e.preventDefault();});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();}});
  var revealContentImpl=null;
  function revealContent(){if(revealContentImpl)revealContentImpl();}
  var mentorButton=document.getElementById('learnMentorButton');
  mentorButton.addEventListener('click',function(){
    var fab=document.getElementById('mentor-fab');
    if(fab)fab.click();
  });
  function syncMentorHost(){
    if(document.getElementById('mentor-fab')&&frame.contentWindow)frame.contentWindow.postMessage({type:'ql-mentor-host-active'},new URL(API_BASE_URL).origin);
  }

  function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
  function setState(text){state.innerHTML='<div><i class="fas fa-spinner fa-spin"></i><div>'+esc(text)+'</div></div>';}
  function showError(text){state.innerHTML='<div><i class="fas fa-triangle-exclamation"></i><div>'+esc(text)+'</div><a class="btn btn-ghost btn-sm" href="/courses">العودة إلى السوق</a></div>';}
  function timed(promise,message,ms){var timer;return Promise.race([promise,new Promise(function(_,reject){timer=setTimeout(function(){reject(new Error(message));},ms||30000);})]).then(function(value){clearTimeout(timer);return value;},function(error){clearTimeout(timer);throw error;});}
  if(!id){showError('لم يتم تحديد الكورس.');return;}
  if(!requestedChapter){location.replace(QLRoutes.routes.dashboard(id));return;}
  setState('جاري تجهيز الكورس والتحقق من الوصول...');
  // A single authenticated response contains the token, current access and course.
  // Keep compatibility with an older backend during rolling deployments.
  timed(LMSPlatformAPI.getContentToken(id,{includeShell:true,chapter:requestedChapter}),'انتهت مهلة تجهيز محتوى الكورس.',30000)
  .then(function(tokenData){
    var accessPromise=tokenData.access && tokenData.course ? Promise.resolve(tokenData) : timed(LMSPlatformAPI.getAccess(id),'انتهت مهلة التحقق من صلاحية الكورس.',30000);
    return accessPromise.then(function(accessResult){return {accessResult:accessResult,tokenData:tokenData};});
  }).then(function(result){
    var accessResult=result.accessResult, tokenData=result.tokenData, access=accessResult.access;
    if(!access || !access.canAccess)throw new Error('لا تملك صلاحية الوصول إلى هذا الكورس.');
    var courseResult=accessResult.course ? Promise.resolve({course:accessResult.course}) : timed(LMSPlatformAPI.getCourse(id),'تعذر تحميل بيانات الكورس.',30000);
    return courseResult.then(function(result){
      var course=result.course;contentCourse=course;contentAccess=access;
      courseSlug=String(course.slug||courseSlug);
      document.title='التعلم — '+course.title;title.textContent=course.title;
      countryLabel.textContent=(course.countryName||'')+(course.currencySymbol?' · '+course.currencySymbol:'');
      if(access.accessType==='campaign_trial'){var remainingDays=Math.ceil(Number(access.trial&&access.trial.remainingSeconds||0)/86400);status.textContent='وصول كامل مؤقت — متبقي تقريبًا '+remainingDays+' يوم، ينتهي '+new Date(access.trial.expiresAt).toLocaleString(course.locale||'ar-EG');}else status.textContent=access.accessType==='trial'?'نسخة تجريبية':'وصول كامل';
      document.getElementById('backLink').href=QLRoutes.routes.course(course.slug);
      setState('جاري فتح الفصل...');
      return tokenData;
    });
  })
    .then(function(tokenData){
      if(window.LMSMentor){
        LMSMentor.mount(requestedChapter,{courseSlug:courseSlug});
        mentorButton.disabled=!document.getElementById('mentor-fab');
      }
      var entryFile=String(tokenData.entryFile||'index.html').replace(/\\/g,'/');
      if(requestedChapter>=1){
        var baseSlash=entryFile.lastIndexOf('/');
        var base=baseSlash>=0?entryFile.slice(0,baseSlash+1):'';
        entryFile=base+(['marketing-launch','marketing-growth','marketing-mastery','marketing-leadership'].includes(courseSlug)&&new URLSearchParams(location.search).get('activity')==='assessment'?'assessment'+requestedChapter+'.html':['marketing-launch','marketing-growth','marketing-mastery','marketing-leadership'].includes(courseSlug)&&new URLSearchParams(location.search).get('activity')==='index'?'course-home.html':requestedChapter===1?'index.html':'ch'+requestedChapter+'.html');
      }
      if(String(id)==='level-2' && requestedChapter<1 && /(?:^|\/)(?:index\.html|capacitor-setup\.md)$/i.test(entryFile)){
        var legacySlash=entryFile.lastIndexOf('/');
        entryFile=(legacySlash>=0?entryFile.slice(0,legacySlash+1):'')+'ch1.html';
      }else if(!/\.html?$/i.test(entryFile)){
        var slash=entryFile.lastIndexOf('/');
        entryFile=(slash>=0?entryFile.slice(0,slash+1):'')+'index.html';
      }
      frame.onload=revealContent;
      revealContentImpl=function(){if(!contentAssigned)return;syncMentorHost();frame.contentWindow.postMessage({type:'ql-course-theme',theme:document.documentElement.dataset.theme||'light'},new URL(API_BASE_URL).origin);if(contentRevealed)return;contentRevealed=true;if(contentAccess&&contentAccess.accessType==='trial'&&window.QuadraMeta){var key='ql_trial_open_'+courseSlug+'_'+String(contentAccess.trial&&contentAccess.trial.startedAt||'');if(!localStorage.getItem(key)){if(QuadraMeta.startTrial(contentCourse,key))localStorage.setItem(key,'1');}}state.style.display='none';frame.style.display='block';activateShield();if(requestedChapter>=1&&!new URLSearchParams(location.search).get('activity')){LMSPlatformAPI.completeLesson(id,'ch'+requestedChapter,{chapter:requestedChapter}).catch(function(error){if(window.LMSUi)LMSUi.showToast(error.message);});}};
      var contentQuery='access_token='+encodeURIComponent(tokenData.token)+'&content_version='+encodeURIComponent(String(Date.now()));
      contentAssigned=true;
      frame.src=API_BASE_URL+'/api/content/'+encodeURIComponent(id)+'/'+entryFile+'?'+contentQuery;
    })
    .catch(function(error){
      showError(error.payload&&error.payload.error||error.message||'تعذر فتح المحتوى.');
      var required=Number(error.payload&&error.payload.requiredChapter);
      if(error.payload&&error.payload.code==='CHAPTER_LOCKED'&&Number.isInteger(required)&&required>=1&&required<=12){
        var link=document.createElement('a');link.className='btn btn-primary btn-sm';
        link.href='/learn/'+encodeURIComponent(id)+'/chapter/'+required+'?activity=assessment';
        link.textContent='ارجع لتقييم الفصل السابق';state.firstElementChild.appendChild(link);
      }
    });

  new MutationObserver(function(){if(frame.contentWindow)frame.contentWindow.postMessage({type:'ql-course-theme',theme:document.documentElement.dataset.theme||'light'},new URL(API_BASE_URL).origin);}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  window.addEventListener('message',function(event){
    if(event.source!==frame.contentWindow)return;
    var data=event.data||{};
    if(data.type==='ql-reader-ready'&&event.origin===new URL(API_BASE_URL).origin){revealContent();return;}
    if(data.type==='ql-course-theme-choice'&&event.origin===new URL(API_BASE_URL).origin){if((data.theme==='dark'||data.theme==='light')&&window.LMSTheme)LMSTheme.applyTheme(data.theme);return;}
    if(data.type==='ql-learning-request'){
      if(window.QLCourseBridge)window.QLCourseBridge.handle(event,{frame:frame,course:id,chapter:requestedChapter,origin:new URL(API_BASE_URL).origin});
      return;
    }
    if(data.type==='course-progress'){
      if(data.courseId&&String(data.courseId)!==String(id))return;
      if(!data.lessonKey)return;
      LMSPlatformAPI.saveProgress(id,{lessonKey:String(data.lessonKey),progress:Number(data.progress||0),completed:Boolean(data.completed),lastPosition:data.lastPosition||{}}).catch(function(error){if(window.LMSUi)LMSUi.showToast(error.message);});
      return;
    }
    if(data.type!=='mentor-chat-request')return;
    var requestId=data.requestId,endpoint=data.endpoint,payload=Object.assign({},data.payload||{});
    if(endpoint!=='chat'&&endpoint!=='speak')return;
    if(endpoint==='chat')payload.courseSlug=courseSlug;
    var path=endpoint==='chat'?'/api/mentor/chat':'/api/mentor/speak';
    var options={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)};
    var token=localStorage.getItem('lms_token_v1');
    if(token)options.headers.Authorization='Bearer '+token;
    fetch(API_BASE_URL+path,options).then(function(response){
      if(endpoint==='speak'){
        if(!response.ok)return response.json().catch(function(){return {ok:false,error:'تعذّر تشغيل صوت Mentor.'};}).then(function(error){event.source&&event.source.postMessage({type:'mentor-response',requestId:requestId,ok:false,payload:error},new URL(API_BASE_URL).origin);});
        return response.blob().then(function(blob){event.source&&event.source.postMessage({type:'mentor-response',requestId:requestId,ok:true,blob:blob,contentType:response.headers.get('Content-Type')||'audio/mpeg'},new URL(API_BASE_URL).origin);});
      }
      return response.json().then(function(result){event.source&&event.source.postMessage({type:'mentor-response',requestId:requestId,ok:response.ok&&result.ok!==false,payload:result},new URL(API_BASE_URL).origin);});
    }).catch(function(){event.source&&event.source.postMessage({type:'mentor-response',requestId:requestId,ok:false,payload:{ok:false,error:'تعذّر الاتصال بالمرشد الذكي.'}},new URL(API_BASE_URL).origin);});
  });
})();
</script>
</body>
</html>
