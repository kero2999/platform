<!doctype html>
<html lang="ar" dir="rtl" data-protected="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشروع التخرج — Quadra Level</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/shared.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.project-wrap{max-width:820px;margin:0 auto;padding:40px 24px 90px;position:relative;z-index:5}.project-head{text-align:center;margin-bottom:26px}.badge{display:inline-flex;gap:8px;align-items:center;padding:7px 15px;border-radius:22px;color:var(--gold);background:rgba(201,168,106,.12);border:1px solid rgba(201,168,106,.3);font-size:.8rem;font-weight:800;margin-bottom:12px}.project-head h1{font-size:1.7rem;font-weight:900;margin:0 0 8px}.project-head p{color:var(--text-faint);line-height:1.8}.brief,.form-card,.evaluation{padding:24px;border-radius:20px;margin-bottom:18px}.brief h2,.form-card h2,.evaluation h2{font-size:1rem;font-weight:900;margin:0 0 12px;display:flex;align-items:center;gap:8px}.brief h2 i,.form-card h2 i,.evaluation h2 i{color:var(--gold)}.brief-text{white-space:pre-line;color:var(--text-dim);line-height:1.9;font-size:.9rem}.project-form textarea{width:100%;min-height:280px;resize:vertical;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;line-height:1.8;outline:0}.project-form textarea:focus{border-color:var(--gold)}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--text-faint);font-size:.78rem;margin:12px 0}.meta strong{color:var(--gold)}.count{font-size:.78rem;color:var(--text-faint);margin-top:7px}.form-actions{display:flex;justify-content:center;margin-top:16px}.evaluation.pass{border:1px solid rgba(0,200,150,.3);background:rgba(0,200,150,.08)}.evaluation.fail{border:1px solid rgba(255,82,82,.3);background:rgba(255,82,82,.08)}.score{font-size:2rem;font-weight:900;color:var(--gold);text-align:center;margin:4px 0 10px}.feedback{line-height:1.85;color:var(--text-dim);white-space:pre-line}.evaluation ul{margin:10px 0 0;padding-inline-start:20px;color:var(--text-dim);line-height:1.8}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}.state{max-width:700px;margin:90px auto;padding:44px 24px;text-align:center;color:var(--text-faint);position:relative;z-index:5}.state i{font-size:2rem;color:var(--gold);display:block;margin-bottom:14px}.error{color:var(--danger)}
</style>
</head>
<body>
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:220px;height:220px;top:7%;left:4%;"></div></div>
<nav class="topbar"><a class="btn btn-ghost btn-sm" id="backLink" href="courses.html"><i class="fas fa-arrow-right"></i> رجوع</a><div class="brand"><img src="images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">مشروع التخرج</span></div><div class="spacer"></div><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button><div id="userChipHolder"></div></nav>
<div id="state" class="state surface-card"><i class="fas fa-spinner fa-spin"></i><div>جاري تجهيز مشروع التخرج...</div></div>
<main id="projectPage" class="project-wrap" style="display:none"><header class="project-head"><div class="badge"><i class="fas fa-flag-checkered"></i> الخطوة الأخيرة قبل الشهادة</div><h1 id="courseTitle">مشروع التخرج</h1><p>قدّم تطبيقًا عمليًا لما تعلمته. سيقيّم الذكاء الاصطناعي مشروعك وفق معايير الكورس، ويعطيك درجة وملاحظات واضحة.</p></header><section class="brief surface-card"><h2><i class="fas fa-clipboard-list"></i> المطلوب</h2><div class="brief-text" id="instructions"></div><div class="meta"><span>درجة النجاح: <strong id="passingScore">70%</strong></span><span id="accessNote"></span></div></section><section class="form-card surface-card" id="formCard"><h2><i class="fas fa-pen-to-square"></i> اكتب مشروعك</h2><form class="project-form" id="projectForm"><textarea id="projectText" minlength="80" required placeholder="اكتب مشروعك بالتفصيل هنا (80 حرفًا على الأقل)..."></textarea><div class="count"><span id="charCount">0</span> حرف</div><div class="form-actions"><button class="btn btn-primary" id="submitBtn" type="submit"><i class="fas fa-robot"></i> إرسال للتقييم الآلي</button></div></form></section><section id="evaluation" class="evaluation surface-card" style="display:none"></section></main>
<script src="js/theme.js"></script><script src="js/config.js"></script><script src="js/auth.js"></script><script src="js/ui.js"></script><script src="js/platform-api.js"></script>
<script>
(function(){
  var params=new URLSearchParams(location.search),courseId=params.get('course')||'',state=document.getElementById('state'),page=document.getElementById('projectPage'),form=document.getElementById('projectForm'),text=document.getElementById('projectText'),submit=document.getElementById('submitBtn'),evaluation=document.getElementById('evaluation'),project=null,course=null;
  function esc(v){return String(v==null?'':v).replace(/[&<>'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c];});}
  function showError(msg){state.innerHTML='<i class="fas fa-triangle-exclamation"></i><div class="error">'+esc(msg)+'</div><a class="btn btn-ghost" href="courses.html" style="margin-top:18px">العودة إلى السوق</a>';}
  function list(items){return Array.isArray(items)&&items.length?'<ul>'+items.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'';}
  function renderSubmission(submission){if(!submission)return;evaluation.style.display='block';var ai=submission.ai_evaluation||{},passed=submission.status==='passed',score=Number(submission.score||ai.score||0);evaluation.className='evaluation surface-card '+(passed?'pass':'fail');evaluation.innerHTML='<h2><i class="fas '+(passed?'fa-circle-check':'fa-rotate-right')+'"></i> '+(passed?'تم اجتياز مشروع التخرج':'نتيجة التقييم — يمكنك إعادة المحاولة')+'</h2><div class="score">'+score+'%</div><div class="feedback">'+esc(submission.feedback||ai.feedback||'لا توجد ملاحظات إضافية.')+'</div>'+list(ai.strengths)+list(ai.improvements)+'<div class="actions">'+(passed?'<a class="btn btn-primary" href="certificate.html?course='+encodeURIComponent(course.slug)+'"><i class="fas fa-certificate"></i> فتح الشهادة</a>':'')+'<a class="btn btn-ghost" href="dashboard.html?course='+encodeURIComponent(course.slug)+'"><i class="fas fa-arrow-right"></i> لوحة الكورس</a></div>' ;if(passed)document.getElementById('formCard').style.display='none';}
  function render(data){course=data.course||{};project=data.project;if(!project)throw new Error('لم يتم إعداد مشروع تخرج لهذا الكورس بعد.');if(!project.ready)throw new Error('أكمل واجتز اختبارات جميع الفصول أولًا لفتح مشروع التخرج.');document.title='مشروع التخرج — '+course.title;document.getElementById('courseTitle').textContent='مشروع التخرج — '+course.title;document.getElementById('instructions').textContent=project.instructions||'طبّق ما تعلمته في مشروع عملي واضح.';document.getElementById('passingScore').textContent=Number(project.passingScore||70)+'%';document.getElementById('backLink').href='dashboard.html?course='+encodeURIComponent(course.slug||course.id);document.getElementById('accessNote').innerHTML=data.access&&data.access.enrolled?'<i class="fas fa-circle-check"></i> الشهادة متاحة بعد الاجتياز':'<i class="fas fa-info-circle"></i> الشهادة تتطلب شراء الكورس';if(project.submission){text.value='';renderSubmission(project.submission);}state.style.display='none';page.style.display='block';}
  if(!courseId){showError('لم يتم تحديد الكورس.');return;}if(window.LMSUi)LMSUi.renderUserChip(document.getElementById('userChipHolder'));text.addEventListener('input',function(){document.getElementById('charCount').textContent=text.value.trim().length;});
  LMSPlatformAPI.getLearning(courseId).then(function(data){render(data.learning);}).catch(function(error){showError(error.message||'تعذر تحميل مشروع التخرج.');});
  form.addEventListener('submit',function(event){event.preventDefault();var value=text.value.trim();if(value.length<80){LMSUi.showToast('اكتب مشروعًا لا يقل عن 80 حرفًا.');return;}submit.disabled=true;submit.innerHTML='<i class="fas fa-spinner fa-spin"></i> الذكاء الاصطناعي يقيّم مشروعك...';LMSPlatformAPI.submitProject(courseId,project.id,value).then(function(data){renderSubmission(data.submission);text.value='';document.getElementById('charCount').textContent='0';}).catch(function(error){evaluation.style.display='block';evaluation.className='evaluation surface-card fail';evaluation.innerHTML='<h2><i class="fas fa-triangle-exclamation"></i> تعذر تقييم المشروع</h2><div class="feedback">'+esc(error.message||'حاول مرة أخرى بعد قليل.')+'</div>';}).finally(function(){submit.disabled=false;submit.innerHTML='<i class="fas fa-robot"></i> إرسال للتقييم الآلي';});});
})();
</script><script src="js/sw-register.js"></script>
</body>
</html>
