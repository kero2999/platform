<!doctype html>
<html lang="ar" dir="rtl" data-protected="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الفصل — Quadra Level</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.quiz-wrap{max-width:820px;margin:0 auto;padding:42px 24px 90px;position:relative;z-index:5}.quiz-header{text-align:center;margin-bottom:28px}.quiz-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:22px;color:var(--gold);background:rgba(201,168,106,.12);border:1px solid rgba(201,168,106,.3);font-size:.8rem;font-weight:800;margin-bottom:13px}.quiz-header h1{font-size:1.7rem;font-weight:900;margin:0 0 8px}.quiz-header p{color:var(--text-faint);font-size:.9rem}.question{padding:22px;border-radius:18px;margin-bottom:15px}.question h2{font-size:1rem;line-height:1.7;margin:0 0 15px;font-weight:800}.option{display:block;padding:12px 14px;border:1px solid var(--border);background:var(--surface);border-radius:12px;margin-top:9px;cursor:pointer;transition:border-color .18s,background .18s}.option:hover{border-color:var(--gold);background:rgba(201,168,106,.07)}.option input{accent-color:var(--gold);margin-left:8px}.quiz-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.result{padding:22px;border-radius:18px;margin-top:22px;text-align:center;line-height:1.9}.result.pass{color:var(--success);border:1px solid rgba(0,200,150,.3);background:rgba(0,200,150,.08)}.result.fail{color:var(--danger);border:1px solid rgba(255,82,82,.3);background:rgba(255,82,82,.08)}.state{max-width:700px;margin:90px auto;padding:44px 24px;text-align:center;color:var(--text-faint);position:relative;z-index:5}.state i{font-size:2rem;color:var(--gold);display:block;margin-bottom:14px}.error{color:var(--danger)}.mastery-panel{padding:22px;border-radius:18px;margin-top:18px;text-align:right}.mastery-panel h2{font-size:1.05rem;margin:0 0 10px}.mastery-panel p{color:var(--text-dim);line-height:1.8}.mastery-panel textarea{width:100%;min-height:150px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;line-height:1.8}.mastery-question{padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0}.mastery-question strong{display:block;color:var(--gold);margin-bottom:8px}.mastery-score{font-size:1.8rem;font-weight:900;color:var(--gold);text-align:center;margin:8px 0}.weaknesses{color:var(--danger);line-height:1.8}
</style>
</head>
<body data-country-gate="true">
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:220px;height:220px;top:7%;left:4%;"></div></div>
<nav class="topbar"><a class="btn btn-ghost btn-sm" id="backLink" href="/courses"><i class="fas fa-arrow-right"></i> رجوع</a><div class="brand"><img src="/images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">اختبار الفصل</span></div><div class="spacer"></div><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button><div id="userChipHolder"></div></nav>
<div id="state" class="state surface-card"><i class="fas fa-spinner fa-spin"></i><div>جاري تجهيز الاختبار...</div></div>
<main id="quizPage" class="quiz-wrap" style="display:none"><header class="quiz-header"><div class="quiz-badge"><i class="fas fa-clipboard-check"></i> اختبار قصير</div><h1 id="quizTitle"></h1><p id="quizMeta"></p><p id="countryScenario" style="color:var(--gold-soft);font-size:.84rem;line-height:1.8"></p></header><form id="quizForm"></form><div class="quiz-actions"><button class="btn btn-primary" id="submitBtn" form="quizForm" type="submit"><i class="fas fa-check"></i> تسليم الإجابات</button><a class="btn btn-ghost" id="lessonLink" href="#"><i class="fas fa-book-open"></i> العودة للفصل</a></div><div id="result" class="result" style="display:none"></div><section id="masteryPanel" class="mastery-panel surface-card" style="display:none"></section></main>
<script src="/js/theme.js"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/platform-api.js"></script>
<script src="/js/country.js"></script><script src="/js/clean-routes.js"></script>
<script>
(function(){
  var route=QLRoutes.current(),courseId=route.course||'',chapter=Number(route.chapter||1),state=document.getElementById('state'),page=document.getElementById('quizPage'),form=document.getElementById('quizForm'),submit=document.getElementById('submitBtn'),result=document.getElementById('result'),masteryPanel=document.getElementById('masteryPanel'),quiz=null,course=null,currentChapter=null,currentAssessment=null;
  function esc(v){return String(v==null?'':v).replace(/[&<>'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c];});}
  function showError(msg){state.innerHTML='<i class="fas fa-triangle-exclamation"></i><div class="error">'+esc(msg)+'</div><a class="btn btn-ghost" href="/courses" style="margin-top:18px">العودة إلى السوق</a>';}
  function renderMastery(chapterData, assessment){
    currentChapter=chapterData; currentAssessment=assessment||null; masteryPanel.style.display='block';
    if(assessment&&assessment.status==='evaluated'){
      var weak=(assessment.weaknesses||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
      masteryPanel.innerHTML='<h2><i class="fas fa-brain"></i> تقييم الفهم المشروط</h2><div class="mastery-score">'+Number(assessment.chapterScore||0)+'%</div><p>'+esc(assessment.understandingFeedback||assessment.templateFeedback||'')+'</p>'+(weak?'<ul class="weaknesses">'+weak+'</ul>':'')+'<p><strong>الفتح التالي:</strong> '+(assessment.passed?'تم فتح الفصل التالي.':'ما زال الفصل التالي مقفولًا. أعد المحاولة بعد مراجعة نقاط الضعف.')+'</p>';
      return;
    }
    if(assessment&&assessment.status==='questions_pending'){
      masteryPanel.innerHTML='<h2><i class="fas fa-brain"></i> أسئلة Kero للتأكد من الفهم</h2><p>درجة التطبيق: <strong>'+Number(assessment.templateScore||0)+'%</strong> — أجب عن الأسئلة الثلاثة باختصار ووضوح.</p><form id="understandingForm">'+(assessment.questions||[]).map(function(q,i){return '<div class="mastery-question"><strong>'+(i+1)+' — '+esc(q.question||'')+'</strong><textarea required data-understanding-answer="'+i+'" placeholder="اكتب إجابتك هنا..."></textarea></div>';}).join('')+'<button class="btn btn-primary" type="submit"><i class="fas fa-check-double"></i> تقييم الفهم</button></form>';
      document.getElementById('understandingForm').addEventListener('submit',function(event){event.preventDefault();var answers=Array.prototype.slice.call(this.querySelectorAll('[data-understanding-answer]')).map(function(x){return x.value.trim();});var button=this.querySelector('button');button.disabled=true;button.textContent='جاري تقييم الفهم...';LMSPlatformAPI.submitChapterAssessment(courseId,chapter,assessment.id,answers).then(function(data){renderMastery(currentChapter,data.assessment);}).catch(function(error){LMSUi.showToast(error.message||'تعذر تقييم الإجابات.');}).finally(function(){button.disabled=false;button.innerHTML='<i class="fas fa-check-double"></i> تقييم الفهم';});});
      return;
    }
    var task=chapterData.practicalTask||'طبّق أهم فكرة في الفصل على حالة عملية واشرح السبب وطريقة القياس.';
    masteryPanel.innerHTML='<h2><i class="fas fa-pen-ruler"></i> Template عملي للفصل</h2><p>'+esc(task)+'</p><form id="templateForm"><textarea required minlength="40" id="templateText" placeholder="اكتب قرارك التطبيقي والدليل وطريقة قياس النتيجة..."></textarea><br><button class="btn btn-primary" type="submit"><i class="fas fa-robot"></i> أرسل لـKero للتقييم وتوليد أسئلة الفهم</button></form>';
    document.getElementById('templateForm').addEventListener('submit',function(event){event.preventDefault();var text=document.getElementById('templateText').value.trim();if(text.length<40){LMSUi.showToast('اكتب إجابة لا تقل عن 40 حرفًا.');return;}var button=this.querySelector('button');button.disabled=true;button.textContent='Kero يقيّم التطبيق ويجهز أسئلة الفهم...';LMSPlatformAPI.startChapterAssessment(courseId,chapter,text).then(function(data){renderMastery(currentChapter,data.assessment);}).catch(function(error){LMSUi.showToast(error.message||'تعذر بدء تقييم الفصل.');}).finally(function(){button.disabled=false;button.innerHTML='<i class="fas fa-robot"></i> أرسل لـKero للتقييم وتوليد أسئلة الفهم';});});
  }
  function render(data){
    course=data.course||{};var ch=(data.chapters||[])[chapter-1];
    var country=data.country||{};
    if(!ch||!ch.unlocked)throw new Error('هذا الفصل مقفول. اجتز اختبار الفصل السابق أولًا.');
    if(!ch.quiz||!ch.quiz.questions.length)throw new Error('لا يوجد اختبار مُعد لهذا الفصل بعد.');
    currentChapter=ch;quiz=ch.quiz;document.title='اختبار الفصل '+chapter+' — '+course.title;document.getElementById('quizTitle').textContent='اختبار الفصل '+chapter+' — '+ch.title;document.getElementById('quizMeta').textContent=quiz.questionCount+' أسئلة — يجب الإجابة الصحيحة عن '+(quiz.requiredCorrect||Math.ceil(quiz.questionCount*quiz.passingScore/100))+' أسئلة على الأقل';document.getElementById('countryScenario').textContent=(quiz.scenarioContext||'')+(country.countryName?' — '+country.countryName:'');document.getElementById('backLink').href=QLRoutes.routes.dashboard(course.slug||course.id);document.getElementById('lessonLink').href=QLRoutes.routes.learn(course.slug||course.id,chapter);
    form.innerHTML=quiz.questions.map(function(q,i){return '<section class="question surface-card"><h2>'+(i+1)+' — '+esc(q.q)+'</h2>'+q.options.map(function(option,j){return '<label class="option"><input required type="radio" name="q'+i+'" value="'+j+'"> '+esc(option)+'</label>';}).join('')+'</section>';}).join('');
    state.style.display='none';page.style.display='block';
    renderMastery(ch, ch.assessment);
  }
  function showResult(attempt){var passed=Boolean(attempt&&attempt.passed),score=Number(attempt&&attempt.score||0);result.className='result '+(passed?'pass':'fail');result.style.display='block';result.innerHTML='<strong>'+ (passed?'أحسنت، اجتزت الاختبار.':'لم تصل إلى درجة النجاح بعد.')+'</strong><br>نتيجتك: '+score+'%'+(passed?'':' — يمكنك إعادة المحاولة.')+(passed?'<div class="quiz-actions"><a class="btn btn-primary" href="' + QLRoutes.routes.dashboard(course.slug) + '"><i class="fas fa-arrow-right"></i> العودة إلى لوحة الكورس</a></div>':'');renderMastery(currentChapter,null);if(passed){submit.style.display='none';document.querySelectorAll('#quizForm input').forEach(function(input){input.disabled=true;});}}
  if(!courseId){showError('لم يتم تحديد الكورس.');return;}
  if(window.LMSUi)LMSUi.renderUserChip(document.getElementById('userChipHolder'));
  LMSPlatformAPI.getLearning(courseId).then(function(data){render(data.learning);}).catch(function(error){showError(error.message||'تعذر تحميل الاختبار.');});
  form.addEventListener('submit',function(event){event.preventDefault();if(!quiz)return;var answers=quiz.questions.map(function(_,i){var selected=form.querySelector('input[name="q'+i+'"]:checked');return selected?Number(selected.value):null;});submit.disabled=true;submit.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري التقييم...';LMSPlatformAPI.submitQuiz(courseId,quiz.id,answers).then(function(data){showResult(data.attempt);}).catch(function(error){result.className='result fail';result.style.display='block';result.textContent=error.message||'تعذر تسليم الاختبار.';}).finally(function(){submit.disabled=false;submit.innerHTML='<i class="fas fa-check"></i> تسليم الإجابات';});});
})();
</script><script src="/js/sw-register.js"></script>
</body>
</html>
