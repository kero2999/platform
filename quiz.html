<!doctype html>
<html lang="ar" dir="rtl" data-protected="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الفصل — Quadra Level</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.quiz-wrap{max-width:820px;margin:0 auto;padding:42px 24px 90px;position:relative;z-index:5}.quiz-header{text-align:center;margin-bottom:28px}.quiz-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:22px;color:var(--gold);background:rgba(201,168,106,.12);border:1px solid rgba(201,168,106,.3);font-size:.8rem;font-weight:800;margin-bottom:13px}.quiz-header h1{font-size:1.7rem;font-weight:900;margin:0 0 8px}.quiz-header p{color:var(--text-faint);font-size:.9rem}.question{padding:22px;border-radius:18px;margin-bottom:15px}.question h2{font-size:1rem;line-height:1.7;margin:0 0 15px;font-weight:800}.option{display:block;padding:12px 14px;border:1px solid var(--border);background:var(--surface);border-radius:12px;margin-top:9px;cursor:pointer;transition:border-color .18s,background .18s}.option:hover{border-color:var(--gold);background:rgba(201,168,106,.07)}.option input{accent-color:var(--gold);margin-left:8px}.quiz-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.result{padding:22px;border-radius:18px;margin-top:22px;text-align:center;line-height:1.9}.result.pass{color:var(--success);border:1px solid rgba(0,200,150,.3);background:rgba(0,200,150,.08)}.result.fail{color:var(--danger);border:1px solid rgba(255,82,82,.3);background:rgba(255,82,82,.08)}.state{max-width:700px;margin:90px auto;padding:44px 24px;text-align:center;color:var(--text-faint);position:relative;z-index:5}.state i{font-size:2rem;color:var(--gold);display:block;margin-bottom:14px}.error{color:var(--danger)}.mastery-panel{padding:22px;border-radius:18px;margin-top:18px;text-align:right}.mastery-panel h2{font-size:1.05rem;margin:0 0 10px}.mastery-panel p{color:var(--text-dim);line-height:1.8}.mastery-panel textarea{width:100%;min-height:150px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text);font:inherit;line-height:1.8}.mastery-question{padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0}.mastery-question strong{display:block;color:var(--gold);margin-bottom:8px}.mastery-score{font-size:1.8rem;font-weight:900;color:var(--gold);text-align:center;margin:8px 0}.weaknesses{color:var(--danger);line-height:1.8}.strengths{color:var(--success);line-height:1.8}.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.score-box{padding:12px;border:1px solid var(--border);border-radius:12px;text-align:center;background:var(--surface)}.score-box strong{display:block;font-size:1.25rem;color:var(--gold)}.score-box span{font-size:.78rem;color:var(--text-faint)}.final-verdict{padding:12px 14px;border-radius:12px;margin-top:14px;font-weight:800}.final-verdict.pass{color:var(--success);background:rgba(0,200,150,.1);border:1px solid rgba(0,200,150,.3)}.final-verdict.fail{color:var(--danger);background:rgba(255,82,82,.1);border:1px solid rgba(255,82,82,.3)}@media(max-width:600px){.score-grid{grid-template-columns:1fr}}
.journey-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.journey-step{padding:10px 8px;border:1px solid var(--border);border-radius:12px;text-align:center;color:var(--text-faint);font-size:.75rem;background:var(--surface)}.journey-step.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,106,.09)}.template-hero{padding:16px;border:1px solid rgba(201,168,106,.28);border-radius:16px;background:linear-gradient(135deg,rgba(201,168,106,.1),rgba(122,82,48,.08));margin:12px 0 16px}.template-hero h3{margin:0 0 7px;font-size:1.02rem;color:var(--gold)}.template-hero p{margin:0}.template-scenario{padding:14px;border-inline-start:4px solid var(--gold);border-radius:12px;background:var(--surface);margin:14px 0;color:var(--text-dim);line-height:1.8}.template-field{padding:15px;border:1px solid var(--border);border-radius:14px;margin:11px 0;background:var(--surface)}.template-field label{display:flex;align-items:flex-start;gap:9px;font-weight:800;line-height:1.7;margin-bottom:9px}.template-field-number{display:grid;place-items:center;min-width:25px;height:25px;border-radius:50%;background:rgba(201,168,106,.14);color:var(--gold);font-size:.75rem}.template-field input,.template-field textarea{width:100%;padding:12px 13px;border-radius:11px;background:var(--surface-strong);border:1px solid var(--border);color:var(--text);font:inherit;line-height:1.8;outline:none}.template-field textarea{min-height:105px;resize:vertical}.template-field input:focus,.template-field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,106,.09)}.template-result{border-color:rgba(63,143,125,.48);background:rgba(63,143,125,.06)}.template-result .template-field-number{background:rgba(63,143,125,.15);color:var(--success)}.template-submit-note{font-size:.78rem;color:var(--text-faint);line-height:1.7;margin:12px 0}.retry-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:600px){.journey-steps{grid-template-columns:1fr}.journey-step{padding:8px}.template-field{padding:12px}}
</style>
</head>
<body data-country-gate="true">
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:220px;height:220px;top:7%;left:4%;"></div></div>
<nav class="topbar"><a class="btn btn-ghost btn-sm" id="backLink" href="/courses"><i class="fas fa-arrow-right"></i> رجوع</a><div class="brand"><img src="/images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">اختبار الفصل</span></div><div class="spacer"></div><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button><div id="userChipHolder"></div></nav>
<div id="state" class="state surface-card"><i class="fas fa-spinner fa-spin"></i><div>جاري تجهيز الاختبار...</div></div>
<main id="quizPage" class="quiz-wrap" style="display:none"><header class="quiz-header"><div class="quiz-badge"><i class="fas fa-clipboard-check"></i> اختبار وتطبيق الفصل</div><h1 id="quizTitle"></h1><p id="quizMeta"></p><p id="countryScenario" style="color:var(--gold-soft);font-size:.84rem;line-height:1.8"></p></header><form id="quizForm"></form><div class="quiz-actions"><button class="btn btn-primary" id="submitBtn" form="quizForm" type="submit"><i class="fas fa-check"></i> تسليم الإجابات</button><a class="btn btn-ghost" id="lessonLink" href="#"><i class="fas fa-book-open"></i> العودة للفصل</a></div><div id="result" class="result" style="display:none"></div><section id="masteryPanel" class="mastery-panel surface-card" style="display:none"></section></main>
<script src="/js/theme.js"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/platform-api.js"></script>
<script src="/js/country.js"></script><script src="/js/clean-routes.js"></script>
<script>
(function(){
  var route=QLRoutes.current(),courseId=route.course||'',chapter=Number(route.chapter||1),state=document.getElementById('state'),page=document.getElementById('quizPage'),form=document.getElementById('quizForm'),submit=document.getElementById('submitBtn'),result=document.getElementById('result'),masteryPanel=document.getElementById('masteryPanel'),quiz=null,course=null,currentChapter=null,currentAssessment=null,retrySubmission=null;
  function esc(v){return String(v==null?'':v).replace(/[&<>'\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c];});}
  function showError(msg){state.innerHTML='<i class="fas fa-triangle-exclamation"></i><div class="error">'+esc(msg)+'</div><a class="btn btn-ghost" href="/courses" style="margin-top:18px">العودة إلى السوق</a>';}
  function journey(active){return '<div class="journey-steps"><div class="journey-step '+(active===1?'active':'')+'"><strong>1</strong> Quiz</div><div class="journey-step '+(active===2?'active':'')+'"><strong>2</strong> التطبيق العملي</div><div class="journey-step '+(active===3?'active':'')+'"><strong>3</strong> أسئلة Kero</div></div>';}
  function buildTemplateForm(chapterData,prefill){
    var template=chapterData.practicalTemplate,answers=(prefill&&prefill.answers)||{},resultValue=(prefill&&prefill.result)||'';
    if(!template){return '<form id="templateForm"><textarea required minlength="40" id="templateText" placeholder="اكتب التطبيق العملي بالتفصيل: القرار، السبب، التنفيذ، والمقياس..."></textarea><br><button class="btn btn-primary" type="submit"><i class="fas fa-robot"></i> أرسل التطبيق إلى Kero</button></form>';}
    var fields=(template.fields||[]).map(function(field,index){var attrs='id="templateField'+index+'" data-template-field="'+esc(field.id)+'" '+(field.required?'required minlength="2" ':'')+'maxlength="4000" placeholder="'+esc(field.placeholder||'اكتب تطبيقك هنا...')+'"';var control=field.type==='text'?'<input type="text" '+attrs+' value="'+esc(answers[field.id]||'')+'">':'<textarea '+attrs+'>'+esc(answers[field.id]||'')+'</textarea>';return '<div class="template-field"><label for="templateField'+index+'"><span class="template-field-number">'+(index+1)+'</span><span>'+esc(field.label)+(field.required?' <b aria-label="مطلوب">*</b>':'')+'</span></label>'+control+'</div>';}).join('');
    return '<div class="template-hero"><h3>'+esc(template.taskTitle)+'</h3><p>'+esc(template.taskDescription)+'</p>'+(template.concept?'<p class="template-submit-note"><strong>المفهوم الذي تطبقه:</strong> '+esc(template.concept)+'</p>':'')+(template.skill?'<p class="template-submit-note"><strong>المهارة المطلوبة:</strong> '+esc(template.skill)+'</p>':'')+'</div><div class="template-scenario"><strong>الحالة التطبيقية:</strong><br>'+esc(template.scenario)+'</div><form id="templateForm" data-structured-template="true">'+fields+'<div class="template-field template-result"><label for="templateResult"><span class="template-field-number"><i class="fas fa-flag-checkered"></i></span><span>'+esc(template.resultPrompt)+' *</span></label><textarea id="templateResult" required minlength="5" maxlength="4000" placeholder="اكتب النتيجة النهائية التي توصلت إليها...">'+esc(resultValue)+'</textarea></div><p class="template-submit-note"><strong>قبل الإرسال:</strong> '+esc(template.minimumCompletionHint||'أكمل كل الخطوات المطلوبة واكتب نتيجة واضحة.')+'</p><p class="template-submit-note"><i class="fas fa-user-pen"></i> اكتب تطبيقك بنفسك. Kero سيراجع ويعطيك Feedback وتصحيحًا، ولن ينفذ المهمة بدلًا منك.</p><button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane"></i> أرسل التطبيق إلى Kero</button></form>';
  }
  function bindTemplateForm(chapterData){var templateForm=document.getElementById('templateForm');if(!templateForm)return;templateForm.addEventListener('submit',function(event){event.preventDefault();var payload;if(this.dataset.structuredTemplate==='true'){var answers={};Array.prototype.slice.call(this.querySelectorAll('[data-template-field]')).forEach(function(input){answers[input.dataset.templateField]=input.value.trim();});payload={answers:answers,result:document.getElementById('templateResult').value.trim()};var total=Object.keys(answers).map(function(key){return answers[key];}).join(' ').length+payload.result.length;if(total<40){LMSUi.showToast('أضف تفاصيل تطبيقية كافية قبل الإرسال.');return;}}else{payload=document.getElementById('templateText').value.trim();if(payload.length<40){LMSUi.showToast('اكتب إجابة لا تقل عن 40 حرفًا.');return;}}var button=this.querySelector('button');button.disabled=true;button.textContent='Kero يراجع التطبيق ويجهز أسئلة الفهم...';LMSPlatformAPI.startChapterAssessment(courseId,chapter,payload).then(function(data){retrySubmission=null;renderMastery(currentChapter,data.assessment);}).catch(function(error){LMSUi.showToast(error.message||'تعذر بدء تقييم الفصل.');}).finally(function(){button.disabled=false;button.innerHTML='<i class="fas fa-paper-plane"></i> أرسل التطبيق إلى Kero';});});}
  function renderMastery(chapterData, assessment){
    currentChapter=chapterData; currentAssessment=assessment||null; masteryPanel.style.display='block';
    if(assessment&&assessment.status==='evaluated'){
      var weak=(assessment.weaknesses||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
      var strong=(assessment.strengths||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
      masteryPanel.innerHTML=journey(3)+'<h2><i class="fas fa-chart-line"></i> النتيجة النهائية لتقييم الفصل</h2><p>قيّم Kero التطبيق والفهم معًا. القرار يعتمد على متوسط العناصر الثلاثة، وليس على الأسلوب أو اللهجة.</p><div class="score-grid"><div class="score-box"><strong>'+Number(assessment.quizScore||0)+'%</strong><span>Quiz</span></div><div class="score-box"><strong>'+Number(assessment.templateScore||0)+'%</strong><span>Template عملي</span></div><div class="score-box"><strong>'+Number(assessment.understandingScore||0)+'%</strong><span>أسئلة الفهم</span></div></div><div class="mastery-score">Chapter Score: '+Number(assessment.chapterScore||0)+'%</div>'+(strong?'<h3>نقاط القوة</h3><ul class="strengths">'+strong+'</ul>':'')+(weak?'<h3>نقاط تحتاج تحسينًا</h3><ul class="weaknesses">'+weak+'</ul>':'')+'<p><strong>تقييم Kero:</strong> '+esc(assessment.finalFeedback||assessment.understandingFeedback||assessment.templateFeedback||'')+'</p><div class="final-verdict '+(assessment.passed?'pass':'fail')+'">'+(assessment.passed?'اجتزت الفصل. تم فتح الفصل التالي.':'لم تجتز الفصل بعد. راجع نقاط التحسين ثم عدّل تطبيقك وأعد الإرسال.')+'</div>'+(assessment.passed?'':'<div class="retry-actions"><button class="btn btn-primary" id="retryTemplateButton" type="button"><i class="fas fa-pen-to-square"></i> عدّل التطبيق وأعد الإرسال</button><a class="btn btn-ghost" href="'+QLRoutes.routes.learn(course.slug||course.id,chapter)+'"><i class="fas fa-book-open"></i> راجع الفصل</a></div>');
      if(!assessment.passed){document.getElementById('retryTemplateButton').addEventListener('click',function(){retrySubmission=assessment.templateSubmission||null;renderMastery(chapterData,null);});}
      return;
    }
    if(assessment&&assessment.status==='questions_pending'){
      masteryPanel.innerHTML=journey(3)+'<h2><i class="fas fa-brain"></i> الخطوة الثالثة — أسئلة Kero للفهم</h2><p>درجة التطبيق: <strong>'+Number(assessment.templateScore||0)+'%</strong> — أجب عن الأسئلة الثلاثة باختصار ووضوح.</p>'+(assessment.templateFeedback?'<p><strong>مراجعة Kero للتطبيق:</strong> '+esc(assessment.templateFeedback)+'</p>':'')+(assessment.templateSubmission?'<div class="retry-actions"><button class="btn btn-ghost" id="editTemplateButton" type="button"><i class="fas fa-pen-to-square"></i> عدّل التطبيق حسب Feedback</button></div>':'')+'<form id="understandingForm">'+(assessment.questions||[]).map(function(q,i){return '<div class="mastery-question"><strong>'+(i+1)+' — '+esc(q.question||'')+'</strong><textarea required data-understanding-answer="'+i+'" placeholder="اكتب إجابتك هنا..."></textarea></div>';}).join('')+'<button class="btn btn-primary" type="submit"><i class="fas fa-check-double"></i> تقييم الفهم</button></form>';
      if(assessment.templateSubmission){document.getElementById('editTemplateButton').addEventListener('click',function(){retrySubmission=assessment.templateSubmission;renderMastery(chapterData,null);});}
      document.getElementById('understandingForm').addEventListener('submit',function(event){event.preventDefault();var answers=Array.prototype.slice.call(this.querySelectorAll('[data-understanding-answer]')).map(function(x){return x.value.trim();});var button=this.querySelector('button');button.disabled=true;button.textContent='جاري تقييم الفهم...';LMSPlatformAPI.submitChapterAssessment(courseId,chapter,assessment.id,answers).then(function(data){renderMastery(currentChapter,data.assessment);}).catch(function(error){LMSUi.showToast(error.message||'تعذر تقييم الإجابات.');}).finally(function(){button.disabled=false;button.innerHTML='<i class="fas fa-check-double"></i> تقييم الفهم';});});
      return;
    }
    if(!chapterData.result){masteryPanel.innerHTML=journey(1)+'<h2><i class="fas fa-clipboard-check"></i> الخطوة الأولى — Quiz الفصل</h2><p>أجب عن الاختبار أولًا، وبعد تسليمه سيفتح التطبيق العملي المخصص لهذا الفصل.</p>';return;}
    masteryPanel.innerHTML=journey(2)+'<h2><i class="fas fa-pen-ruler"></i> التطبيق العملي — الخطوة الثانية</h2><p>نفّذ الخطوات التالية بنفسك. المطلوب تطبيق مفهوم الفصل، وليس تكرار تعريفات نظرية.</p>'+buildTemplateForm(chapterData,retrySubmission);
    bindTemplateForm(chapterData);
  }
  function render(data){
    course=data.course||{};var ch=(data.chapters||[])[chapter-1];
    var country=data.country||{};
    if(!ch||!ch.unlocked)throw new Error('هذا الفصل مقفول. اجتز اختبار الفصل السابق أولًا.');
    if(!ch.quiz||!ch.quiz.questions.length)throw new Error('لا يوجد اختبار مُعد لهذا الفصل بعد.');
    currentChapter=ch;quiz=ch.quiz;document.title='اختبار الفصل '+chapter+' — '+course.title;document.getElementById('quizTitle').textContent='اختبار الفصل '+chapter+' — '+ch.title;document.getElementById('quizMeta').textContent=quiz.questionCount+' أسئلة — يجب الإجابة الصحيحة عن '+(quiz.requiredCorrect||Math.ceil(quiz.questionCount*quiz.passingScore/100))+' أسئلة على الأقل';document.getElementById('countryScenario').textContent=(quiz.scenarioContext||'')+(country.countryName?' — '+country.countryName:'');document.getElementById('backLink').href=QLRoutes.routes.dashboard(course.slug||course.id);document.getElementById('lessonLink').href=QLRoutes.routes.learn(course.slug||course.id,chapter);
    form.innerHTML=quiz.questions.map(function(q,i){return '<section class="question surface-card"><h2>'+(i+1)+' — '+esc(q.q)+'</h2>'+q.options.map(function(option,j){return '<label class="option"><input required type="radio" name="q'+i+'" value="'+j+'"> '+esc(option)+'</label>';}).join('')+'</section>';}).join('');
    state.style.display='none';page.style.display='block';
    renderMastery(ch, ch.assessment);
  }
  function showResult(attempt){var passed=Boolean(attempt&&attempt.passed),score=Number(attempt&&attempt.score||0);currentChapter.result=attempt||null;result.className='result '+(passed?'pass':'fail');result.style.display='block';result.innerHTML='<strong>'+ (passed?'أحسنت، اجتزت الاختبار.':'لم تصل إلى درجة النجاح بعد.')+'</strong><br>نتيجتك: '+score+'%'+(passed?'':' — يمكنك إعادة المحاولة.')+(passed?'<div class="quiz-actions"><a class="btn btn-primary" href="' + QLRoutes.routes.dashboard(course.slug) + '"><i class="fas fa-arrow-right"></i> العودة إلى لوحة الكورس</a></div>':'');renderMastery(currentChapter,null);if(passed){submit.style.display='none';document.querySelectorAll('#quizForm input').forEach(function(input){input.disabled=true;});}}
  if(!courseId){showError('لم يتم تحديد الكورس.');return;}
  if(window.LMSUi)LMSUi.renderUserChip(document.getElementById('userChipHolder'));
  LMSPlatformAPI.getLearning(courseId).then(function(data){render(data.learning);}).catch(function(error){showError(error.message||'تعذر تحميل الاختبار.');});
  form.addEventListener('submit',function(event){event.preventDefault();if(!quiz)return;var answers=quiz.questions.map(function(_,i){var selected=form.querySelector('input[name="q'+i+'"]:checked');return selected?Number(selected.value):null;});submit.disabled=true;submit.innerHTML='<i class="fas fa-spinner fa-spin"></i> جاري التقييم...';LMSPlatformAPI.submitQuiz(courseId,quiz.id,answers).then(function(data){showResult(data.attempt);}).catch(function(error){result.className='result fail';result.style.display='block';result.textContent=error.message||'تعذر تسليم الاختبار.';}).finally(function(){submit.disabled=false;submit.innerHTML='<i class="fas fa-check"></i> تسليم الإجابات';});});
})();
</script><script src="/js/activity.js"></script><script src="/js/sw-register.js"></script>
</body>
</html>
