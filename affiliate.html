<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل المسوق — Quadra Level</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.detail-wrap{position:relative;z-index:5;max-width:1120px;margin:0 auto;padding:44px 24px 80px}.detail-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:24px}.detail-heading h1{font-size:2rem;font-weight:900;margin:0 0 7px}.detail-heading p{color:var(--text-faint);margin:0;line-height:1.8}.back-link{white-space:nowrap}.profile-card{padding:22px;border-radius:20px;margin-bottom:18px}.profile-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.profile-icon{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;background:rgba(201,168,106,.14);color:var(--gold);font-size:1.35rem}.profile-meta{color:var(--text-faint);font-size:.82rem;line-height:1.8}.profile-meta strong{color:var(--text);font-size:1.1rem}.badge{padding:5px 11px;border-radius:20px;font-size:.72rem;font-weight:800}.badge.active{background:rgba(0,200,150,.14);color:var(--success)}.badge.inactive{background:rgba(255,82,82,.13);color:var(--danger)}.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat-card{padding:18px;border-radius:17px;background:var(--surface-strong);border:1px solid var(--border)}.stat-card i{color:var(--gold);font-size:1rem}.stat-card strong{display:block;font-size:1.45rem;color:var(--gold-soft);margin:10px 0 3px}.stat-card span{display:block;color:var(--text-faint);font-size:.76rem}.balance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.balance-card{padding:18px;border-radius:17px;border:1px solid var(--border);background:linear-gradient(135deg,rgba(201,168,106,.13),var(--surface-strong))}.balance-card strong{display:block;font-size:1.35rem;color:var(--gold-soft);margin-top:8px}.balance-card span{color:var(--text-faint);font-size:.76rem}.section-card{padding:22px;border-radius:20px;margin-top:18px}.section-card h2{font-size:1.05rem;margin:0 0 16px}.info-table{width:100%;border-collapse:collapse}.info-table td{padding:12px 8px;border-bottom:1px solid var(--border);font-size:.84rem}.info-table td:first-child{color:var(--text-faint);width:42%}.info-table td:last-child{font-weight:700}.copy-link{word-break:break-all;color:var(--gold-soft)}.state{text-align:center;padding:48px;color:var(--text-faint)}.error{color:var(--danger);line-height:1.8}@media(max-width:820px){.stats-grid{grid-template-columns:repeat(2,1fr)}.balance-grid{grid-template-columns:1fr}.detail-wrap{padding:28px 16px 60px}}@media(max-width:460px){.stats-grid{grid-template-columns:1fr 1fr}.stat-card{padding:14px}.stat-card strong{font-size:1.2rem}}
</style>
</head>
<body>
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:230px;height:230px;top:8%;left:4%;"></div><div class="geo-shape geo-square" style="width:110px;height:110px;top:68%;right:5%;animation-delay:2s;"></div></div>
<nav class="topbar"><div class="brand"><img src="/images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">Quadra Level</span></div><a class="btn btn-ghost btn-sm" href="/admin"><i class="fas fa-arrow-right"></i> العودة للإدارة</a><div class="spacer"></div><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button><div id="userChipHolder"></div></nav>
<main class="detail-wrap"><div id="pageState" class="panel surface-card state"><i class="fas fa-spinner fa-spin"></i><br>جاري تحميل تفاصيل المسوق...</div><div id="detailContent" hidden><header class="detail-heading"><div><h1><i class="fas fa-chart-line" style="color:var(--gold)"></i> تفاصيل المسوق</h1><p>عرض الزيارات والتسجيلات والتجارب والمشتريات والرصيد المستحق.</p></div><a class="btn btn-ghost btn-sm back-link" href="/admin"><i class="fas fa-users"></i> كل المسوقين</a></header><section id="profileCard" class="panel surface-card profile-card"></section><section class="stats-grid" id="statsGrid"></section><section class="panel surface-card section-card"><h2><i class="fas fa-wallet" style="color:var(--gold)"></i> الرصيد والعمولات</h2><div class="balance-grid" id="balanceGrid"></div></section><section class="panel surface-card section-card"><h2><i class="fas fa-link" style="color:var(--gold)"></i> رابط الإحالة</h2><table class="info-table"><tbody><tr><td>الرابط الخاص</td><td><a id="affiliateLink" class="copy-link" target="_blank" rel="noopener"></a></td></tr><tr><td>نسبة عمولة التجربة</td><td id="trialRate"></td></tr><tr><td>نسبة عمولة الشراء</td><td id="purchaseRate"></td></tr><tr><td>تاريخ الإنشاء</td><td id="createdAt"></td></tr></tbody></table></section></div></main>
<script src="/js/theme.js"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/platform-api.js"></script><script src="/js/sw-register.js"></script>
<script>
(function(){
  var state=document.getElementById('pageState'),content=document.getElementById('detailContent');
  function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
  function money(cents){return (Number(cents||0)/100).toLocaleString('ar-EG')+' EGP';}
  function num(value){return Number(value||0).toLocaleString('ar-EG');}
  function date(value){return value?new Date(value).toLocaleString('ar-EG'):'—';}
  function stat(icon,label,value){return '<article class="stat-card"><i class="fas '+icon+'"></i><strong>'+num(value)+'</strong><span>'+label+'</span></article>';}
  var id=new URLSearchParams(location.search).get('id');
  if(!id){state.innerHTML='<div class="error">رابط المسوق غير مكتمل. ارجع إلى لوحة الإدارة واختر مسوقًا.</div>';return;}
  if(window.LMSUi)LMSUi.renderUserChip(document.getElementById('userChipHolder'));
  LMSPlatformAPI.getAdminAffiliate(id).then(function(data){
    var a=data.affiliate||{},s=a.stats||{};var link=location.origin+'/?ref='+encodeURIComponent(a.affiliate_code);
    document.getElementById('profileCard').innerHTML='<div class="profile-line"><div class="profile-icon"><i class="fas fa-user-tie"></i></div><div class="profile-meta"><strong>'+esc(a.name)+'</strong><br>'+esc(a.platform)+(a.profile_url?' · <a href="'+esc(a.profile_url)+'" target="_blank" rel="noopener">فتح الحساب</a>':'')+'</div><span class="badge '+(a.status==='active'?'active':'inactive')+'">'+(a.status==='active'?'نشط':'غير نشط')+'</span></div>';
    document.getElementById('statsGrid').innerHTML=stat('fa-eye','الزيارات',s.visits)+stat('fa-user-plus','التسجيلات',s.registrations)+stat('fa-clock','التجارب',s.trials)+stat('fa-cart-shopping','المشتريات',s.purchases)+stat('fa-coins','إجمالي المبيعات',money(s.revenueCents));
    document.getElementById('balanceGrid').innerHTML='<div class="balance-card"><span>الرصيد المستحق حاليًا</span><strong>'+money(s.pendingCommissionCents)+'</strong></div><div class="balance-card"><span>إجمالي العمولات</span><strong>'+money(s.commissionCents)+'</strong></div><div class="balance-card"><span>المبيعات المحققة</span><strong>'+money(s.revenueCents)+'</strong></div>';
    var linkNode=document.getElementById('affiliateLink');linkNode.href=link;linkNode.textContent=link;document.getElementById('trialRate').textContent=Number(a.trial_commission_rate||0)+'%';document.getElementById('purchaseRate').textContent=Number(a.purchase_commission_rate||0)+'%';document.getElementById('createdAt').textContent=date(a.created_at);
    state.hidden=true;content.hidden=false;
  }).catch(function(error){state.innerHTML='<div class="error"><i class="fas fa-triangle-exclamation"></i><br>'+esc(error.message||'تعذر تحميل تفاصيل المسوق.')+'<br><a class="btn btn-ghost btn-sm" href="/admin">العودة إلى الإدارة</a></div>';});
})();
</script>
</body>
</html>
