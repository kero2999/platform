<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://my-server1-hk07.onrender.com" crossorigin>
<title>سوق الكورسات — Quadra Level</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<link rel="stylesheet" href="/css/public.css">
<style>
.market-hero{position:relative;z-index:5;max-width:1200px;margin:0 auto;padding:58px 30px 24px;display:flex;align-items:end;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.market-eyebrow{color:var(--gold);font-weight:800;font-size:.84rem;letter-spacing:.5px;margin-bottom:10px;}
.market-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:900;line-height:1.2;margin-bottom:12px;}
.market-sub{color:var(--text-faint);font-size:.98rem;line-height:1.8;max-width:640px;}
.market-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.market-search{min-width:260px;padding:12px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);color:var(--text);outline:none;}
.market-search:focus{border-color:var(--gold);}
.market-content{position:relative;z-index:5;max-width:1200px;margin:0 auto;padding:12px 30px 80px;}
.market-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0;color:var(--text-faint);font-size:.84rem;}
.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px;}
.course-card{overflow:hidden;display:flex;flex-direction:column;min-height:370px;}
.course-thumb{height:150px;background:linear-gradient(135deg,rgba(201,168,106,.28),rgba(63,143,125,.23));display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.course-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.course-thumb i{font-size:3rem;color:var(--gold);opacity:.8;}
.course-body{padding:22px;display:flex;flex-direction:column;gap:11px;flex:1;}
.course-category{color:var(--gold);font-size:.74rem;font-weight:800;}
.course-title{font-size:1.08rem;font-weight:900;line-height:1.45;}
.course-description{color:var(--text-faint);font-size:.82rem;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.course-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;}
.course-price{font-size:1rem;font-weight:900;color:var(--gold-soft);}
.course-instructor{font-size:.76rem;color:var(--text-faint);}
.state-card{padding:42px 24px;text-align:center;color:var(--text-faint);}
.state-card i{font-size:2rem;color:var(--gold);margin-bottom:14px;display:block;}
@media (max-width:640px){.market-hero,.market-content{padding-left:16px;padding-right:16px}.market-search{width:100%;min-width:0}.market-tools{width:100%}.market-tools .btn{flex:1}}
</style>
</head>
<body data-country-gate="true">
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:220px;height:220px;top:8%;left:4%;"></div><div class="geo-shape geo-square" style="width:110px;height:110px;top:58%;right:6%;animation-delay:2s;"></div></div>
<nav class="topbar">
  <div class="brand"><img src="/images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">Quadra Level</span></div>
  <a class="btn btn-ghost btn-sm" href="/"><i class="fas fa-house"></i> الرئيسية</a>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button>
  <div id="userChipHolder"></div>
</nav>
<section class="market-hero">
  <div>
    <div class="market-eyebrow"><i class="fas fa-sparkles"></i> Quadra Level Marketplace</div>
    <h1 class="market-title">اكتشف الكورس المناسب لهدفك</h1>
    <p class="market-sub">تصفح الكورسات، اقرأ التفاصيل، وابدأ معاينة مجانية قبل شراء الكورس الذي تحتاجه. حسابك مجاني، وكل كورس تشتريه يبقى متاحًا لك بشكل مستقل.</p>
  </div>
  <div class="market-tools">
    <input class="market-search" id="courseSearch" type="search" placeholder="ابحث باسم الكورس أو التصنيف..." aria-label="البحث في الكورسات">
    <button class="btn btn-outline" id="clearSearch" type="button">عرض الكل</button>
  </div>
</section>
<main class="market-content">
  <div class="market-meta"><span id="courseCount">جاري تحميل الكورسات...</span><span id="marketStatus"></span></div>
  <div class="market-grid" id="courseGrid"></div>
</main>
<div data-site-footer></div>
<script src="/js/theme.js"></script>
<script src="/js/site-config.js"></script>
<script src="/js/meta-pixel.js"></script>
<script src="/js/site.js"></script>
<script src="/js/config.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
  <script src="/js/platform-api.js"></script>
<script src="/js/country.js"></script>
  <script src="/js/clean-routes.js"></script>
<script>
(function () {
  var allCourses = [];
  var grid = document.getElementById('courseGrid');
  var count = document.getElementById('courseCount');
  var status = document.getElementById('marketStatus');
  var search = document.getElementById('courseSearch');

  if (window.LMSUi) LMSUi.renderUserChip(document.getElementById('userChipHolder'));

  function escapeHtml(value) {
    return String(value == null ? '' : value).replace(/[&<>'"]/g, function (char) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char];
    });
  }

  function price(course) {
    if (course.pricingConfigured === false && course.countryCode !== 'EG') return 'السعر المحلي قيد الإعداد';
    if (Number(course.priceCents || 0) === 0) return 'مجاني';
    var locale = course.locale || (window.LMSCountry && LMSCountry.getProfile().locale) || 'ar-EG';
    return (Number(course.priceCents) / 100).toLocaleString(locale, { maximumFractionDigits: 2 }) + ' ' + escapeHtml(course.currencySymbol || course.currency || 'EGP');
  }

  function render(list) {
    count.textContent = list.length + ' كورس متاح';
    if (!list.length) {
      grid.innerHTML = '<div class="state-card surface-card" style="grid-column:1/-1"><i class="fas fa-book-open"></i><div>لا توجد كورسات مطابقة حاليًا.</div></div>';
      return;
    }
    grid.innerHTML = list.map(function (course) {
      var category = course.category && course.category.name ? course.category.name : 'عام';
      var image = course.thumbnailUrl ? '<img src="' + escapeHtml(course.thumbnailUrl) + '" alt="" loading="lazy">' : '<i class="fas fa-graduation-cap"></i>';
      return '<article class="course-card surface-card">' +
        '<div class="course-thumb">' + image + '</div>' +
        '<div class="course-body">' +
          '<div class="course-category">' + escapeHtml(category) + '</div>' +
          '<h2 class="course-title">' + escapeHtml(course.title) + '</h2>' +
          '<p class="course-description">' + escapeHtml(course.description || 'تعلم بخطوات عملية مع محتوى منظم وتمارين تطبيقية.') + '</p>' +
          '<div class="course-instructor">' + (course.instructor ? 'بواسطة ' + escapeHtml(course.instructor) : 'مسار تعليمي عملي') + '</div>' +
          '<div class="course-footer"><span class="course-price">' + price(course) + '</span><a class="btn btn-primary btn-sm" href="' + QLRoutes.routes.course(course.slug) + '">التفاصيل <i class="fas fa-arrow-left"></i></a></div>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  function filter() {
    var term = search.value.trim().toLowerCase();
    render(!term ? allCourses : allCourses.filter(function (course) {
      var category = course.category && course.category.name ? course.category.name : '';
      return [course.title, course.description, category, course.instructor].join(' ').toLowerCase().indexOf(term) !== -1;
    }));
  }

  var CATALOG_CACHE_KEY = 'ql_public_catalog_v2_' + ((window.LMSPlatformAPI && LMSPlatformAPI.countryCode()) || 'EG');

  function readCatalogCache() {
    try {
      var cached = JSON.parse(localStorage.getItem(CATALOG_CACHE_KEY) || 'null');
      if (!cached || !Array.isArray(cached.courses)) return null;
      return cached;
    } catch (error) {
      return null;
    }
  }

  function writeCatalogCache(courses) {
    try {
      localStorage.setItem(CATALOG_CACHE_KEY, JSON.stringify({
        savedAt: Date.now(),
        courses: courses
      }));
    } catch (error) {
      // التخزين المحلي اختياري؛ لا نوقف عرض الكورسات إذا تعذر.
    }
  }

  function showCatalogError(error, cached) {
    if (cached) {
      status.textContent = 'تعذر تحديث القائمة؛ المعروض هو آخر إصدار محفوظ.';
      return;
    }
    count.textContent = '';
    status.textContent = error && error.message ? error.message : '';
    grid.innerHTML = '<div class="state-card surface-card" style="grid-column:1/-1"><i class="fas fa-triangle-exclamation"></i><div>تعذر تحميل الكورسات حاليًا. حاول تحديث الصفحة.</div></div>';
  }

  function refreshCatalog(cached) {
    status.textContent = cached ? 'جارٍ تحديث القائمة...' : '';
    LMSPlatformAPI.getCourses().then(function (data) {
      allCourses = Array.isArray(data.courses) ? data.courses : [];
      writeCatalogCache(allCourses);
      status.textContent = '';
      filter();
    }).catch(function (error) {
      showCatalogError(error, cached);
    });
  }

  search.addEventListener('input', filter);
  document.getElementById('clearSearch').addEventListener('click', function () { search.value = ''; filter(); search.focus(); });

  var cachedCatalog = readCatalogCache();
  if (cachedCatalog) {
    allCourses = cachedCatalog.courses;
    filter();
  }
  refreshCatalog(Boolean(cachedCatalog));
  var renderedCountryCode = (window.LMSPlatformAPI && LMSPlatformAPI.countryCode ? LMSPlatformAPI.countryCode() : '') || 'EG';
  window.addEventListener('qlcountrychange', function (event) { var nextCode=event.detail&&event.detail.countryCode||renderedCountryCode; if(nextCode===renderedCountryCode)return; renderedCountryCode=nextCode; allCourses=[]; refreshCatalog(false); });
})();
</script>
<script src="/js/sw-register.js"></script>
</body>
</html>
