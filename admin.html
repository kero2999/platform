<!DOCTYPE html>
<html lang="ar" dir="rtl" data-protected="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة Marketplace — Quadra Level</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/shared.css">
<style>
.admin-wrap{position:relative;z-index:5;max-width:1200px;margin:0 auto;padding:44px 30px 80px;}
.admin-heading{margin-bottom:26px}.admin-heading h1{font-size:2rem;font-weight:900;margin-bottom:8px}.admin-heading p{color:var(--text-faint);line-height:1.7}
.admin-layout{display:grid;grid-template-columns:minmax(280px,.75fr) minmax(0,1.25fr);gap:22px;align-items:start}.panel{padding:24px;border-radius:20px}.panel h2{font-size:1.1rem;margin-bottom:18px}.field{margin-bottom:14px}.field label{display:block;color:var(--text-dim);font-size:.8rem;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 13px;background:var(--surface-strong);border:1px solid var(--border);border-radius:11px;color:var(--text);outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.course-list{display:flex;flex-direction:column;gap:14px}.admin-course{padding:18px;border-radius:16px;background:var(--surface-strong);border:1px solid var(--border)}.admin-course-head{display:flex;justify-content:space-between;gap:14px;align-items:start}.admin-course h3{font-size:1rem;margin-bottom:5px}.admin-course-meta{font-size:.76rem;color:var(--text-faint);line-height:1.7}.badge{padding:4px 9px;border-radius:20px;font-size:.7rem;font-weight:800;white-space:nowrap}.badge.published{background:rgba(0,200,150,.14);color:var(--success)}.badge.draft{background:rgba(201,168,106,.15);color:var(--gold)}.badge.archived{background:rgba(255,82,82,.13);color:var(--danger)}.admin-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.admin-actions input[type=file]{max-width:220px;color:var(--text-faint);font-size:.75rem}.state{padding:30px;text-align:center;color:var(--text-faint)}.state i{display:block;color:var(--gold);font-size:1.8rem;margin-bottom:10px}.form-error{color:var(--danger);font-size:.8rem;margin:10px 0;line-height:1.6}.form-success{color:var(--success);font-size:.8rem;margin:10px 0;line-height:1.6}
@media (max-width:820px){.admin-wrap{padding-left:16px;padding-right:16px}.admin-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="geo-bg"><div class="geo-shape geo-circle" style="width:230px;height:230px;top:8%;left:4%;"></div><div class="geo-shape geo-square" style="width:110px;height:110px;top:68%;right:5%;animation-delay:2s;"></div></div>
<nav class="topbar"><div class="brand"><img src="/images/logo-mark.png" alt="Quadra Level" class="brand-logo"><span class="full">Quadra Level</span></div><a class="btn btn-ghost btn-sm" href="/courses"><i class="fas fa-store"></i> سوق الكورسات</a><div class="spacer"></div><button class="icon-btn" onclick="LMSTheme.toggleTheme()" title="الوضع الليلي/النهاري"><i class="fas fa-moon" data-theme-icon></i></button><div id="userChipHolder"></div></nav>
<main class="admin-wrap"><header class="admin-heading"><h1><i class="fas fa-sliders"></i> إدارة Marketplace</h1><p>أضف الكورس مرة واحدة، ارفع ملف ZIP، ثم انشره ليظهر تلقائيًا في سوق الكورسات. كل العمليات محمية بصلاحية المشرف.</p></header><div class="admin-layout"><section class="panel surface-card"><h2>إضافة تصنيف أو كورس</h2><form id="courseForm"><div class="field"><label>عنوان الكورس</label><input id="courseTitle" required></div><div class="field"><label>الرابط المختصر (اختياري)</label><input id="courseSlug" placeholder="digital-marketing"></div><div class="field"><label>الوصف</label><textarea id="courseDescription"></textarea></div><div class="form-grid"><div class="field"><label>السعر بالسنتات/قروش EGP</label><input id="coursePrice" type="number" min="0" step="1" value="0" required></div><div class="field"><label>مدة التجربة بالدقائق</label><input id="courseTrial" type="number" min="0" max="1440" step="1" value="10" required></div></div><div class="form-grid"><div class="field"><label>التصنيف</label><select id="courseCategory"><option value="">بدون تصنيف</option></select></div><div class="field"><label>المدرس</label><input id="courseInstructor"></div></div><div class="field"><label>رابط الصورة (اختياري)</label><input id="courseThumbnail" type="url" placeholder="https://..."></div><div id="courseFormMessage"></div><button class="btn btn-primary btn-block" type="submit"><i class="fas fa-plus"></i> إنشاء الكورس كمسودة</button></form><hr style="border-color:var(--border);margin:26px 0"><form id="categoryForm"><div class="field"><label>اسم تصنيف جديد</label><input id="categoryName" placeholder="Programming"></div><button class="btn btn-outline btn-block" type="submit"><i class="fas fa-folder-plus"></i> إضافة تصنيف</button></form><div id="categoryMessage"></div></section><section class="panel surface-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px"><h2 style="margin:0">الكورسات</h2><button class="btn btn-ghost btn-sm" id="refreshCourses" type="button"><i class="fas fa-rotate"></i> تحديث</button></div><div id="courseList" class="course-list"><div class="state"><i class="fas fa-spinner fa-spin"></i>جاري التحميل...</div></div></section></div></main>
<script src="/js/theme.js"></script><script src="/js/config.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script><script src="/js/platform-api.js"></script>
<script>
(function(){
  var list=document.getElementById('courseList'), categorySelect=document.getElementById('courseCategory');
  if(window.LMSUi)LMSUi.renderUserChip(document.getElementById('userChipHolder'));
  function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});}
  function msg(id,text,ok){document.getElementById(id).innerHTML='<div class="'+(ok?'form-success':'form-error')+'">'+esc(text)+'</div>';}
  function loadCategories(){return LMSPlatformAPI.request('/api/admin/categories').then(function(d){categorySelect.innerHTML='<option value="">بدون تصنيف</option>'+(d.categories||[]).map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');});}
  function loadCourses(){list.innerHTML='<div class="state"><i class="fas fa-spinner fa-spin"></i>جاري التحميل...</div>';return LMSPlatformAPI.request('/api/admin/courses').then(function(d){var courses=d.courses||[];if(!courses.length){list.innerHTML='<div class="state"><i class="fas fa-book"></i>لا توجد كورسات بعد.</div>';return;}list.innerHTML=courses.map(function(c){return '<article class="admin-course" data-course-id="'+c.id+'"><div class="admin-course-head"><div><h3>'+esc(c.title)+'</h3><div class="admin-course-meta">slug: '+esc(c.slug)+'<br>السعر: '+(Number(c.priceCents)/100).toLocaleString('ar-EG')+' '+esc(c.currency||'EGP')+'<br>الإصدار: '+(c.currentVersionId?'مرفوع':'لم يرفع بعد')+'</div></div><span class="badge '+esc(c.status)+'">'+esc(c.status)+'</span></div><div class="admin-actions"><input type="file" accept=".zip,application/zip" data-upload><button class="btn btn-ghost btn-sm" type="button" data-upload-btn><i class="fas fa-upload"></i> رفع ZIP</button><button class="btn btn-primary btn-sm" type="button" data-publish '+(c.currentVersionId?'':'disabled')+'><i class="fas fa-globe"></i> نشر</button></div></article>';}).join('');bindActions();});}
  function bindActions(){list.querySelectorAll('[data-upload-btn]').forEach(function(btn){btn.addEventListener('click',function(){var card=btn.closest('[data-course-id]'),file=card.querySelector('[data-upload]').files[0];if(!file){if(window.LMSUi)LMSUi.showToast('اختر ملف ZIP أولًا.');return;}btn.disabled=true;fetch(API_BASE_URL+'/api/admin/courses/'+card.dataset.courseId+'/upload-zip',{method:'POST',headers:{'Content-Type':'application/zip',Authorization:'Bearer '+(localStorage.getItem('lms_token_v1')||'')},body:file}).then(function(r){return r.json();}).then(function(d){if(!d.ok)throw new Error(d.error||'فشل رفع الملف.');if(window.LMSUi)LMSUi.showToast('تم رفع ZIP بنجاح.');return loadCourses();}).catch(function(e){if(window.LMSUi)LMSUi.showToast(e.message);}).finally(function(){btn.disabled=false;});});});list.querySelectorAll('[data-publish]').forEach(function(btn){btn.addEventListener('click',function(){var id=btn.closest('[data-course-id]').dataset.courseId;btn.disabled=true;LMSPlatformAPI.request('/api/admin/courses/'+id+'/publish',{method:'POST',body:'{}'}).then(function(){if(window.LMSUi)LMSUi.showToast('تم نشر الكورس.');return loadCourses();}).catch(function(e){if(window.LMSUi)LMSUi.showToast(e.message);}).finally(function(){btn.disabled=false;});});});}
  document.getElementById('courseForm').addEventListener('submit',function(e){e.preventDefault();var btn=e.target.querySelector('button[type=submit]');btn.disabled=true;LMSPlatformAPI.request('/api/admin/courses',{method:'POST',body:JSON.stringify({title:document.getElementById('courseTitle').value,slug:document.getElementById('courseSlug').value,description:document.getElementById('courseDescription').value,priceCents:Number(document.getElementById('coursePrice').value),trialMinutes:Number(document.getElementById('courseTrial').value),categoryId:document.getElementById('courseCategory').value||null,instructor:document.getElementById('courseInstructor').value,thumbnailUrl:document.getElementById('courseThumbnail').value||null})}).then(function(){msg('courseFormMessage','تم إنشاء الكورس كمسودة. ارفع ZIP من قائمة الكورسات ثم انشره.',true);e.target.reset();return loadCourses();}).catch(function(err){msg('courseFormMessage',err.message,false);}).finally(function(){btn.disabled=false;});});
  document.getElementById('categoryForm').addEventListener('submit',function(e){e.preventDefault();var name=document.getElementById('categoryName').value.trim();if(!name)return;LMSPlatformAPI.request('/api/admin/categories',{method:'POST',body:JSON.stringify({name:name})}).then(function(){msg('categoryMessage','تمت إضافة التصنيف.',true);document.getElementById('categoryName').value='';return loadCategories();}).catch(function(err){msg('categoryMessage',err.message,false);});});
  document.getElementById('refreshCourses').addEventListener('click',loadCourses);Promise.all([loadCategories(),loadCourses()]).catch(function(err){list.innerHTML='<div class="state"><i class="fas fa-lock"></i>'+esc(err.message||'ليس لديك صلاحية المشاهدة.')+'</div>';});
})();
</script>
<script src="/js/sw-register.js"></script>
</body>
</html>
